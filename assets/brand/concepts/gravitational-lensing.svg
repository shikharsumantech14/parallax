<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gravitational lensing warp: turbulence-driven displacement of the grid/rings -->
    <filter id="lens" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.009" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="42" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- Soft shadow for the focal ring (dimension above the warped plane) -->
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="b"/>
      <feOffset in="b" dx="0" dy="10" result="o"/>
      <feFlood flood-color="#161412" flood-opacity="0.30" result="c"/>
      <feComposite in="c" in2="o" operator="in" result="sh"/>
      <feMerge>
        <feMergeNode in="sh"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <!-- Paper vignette + gravity well darkening toward the lens center -->
    <radialGradient id="paper" cx="50%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#f7f4ee"/>
      <stop offset="62%" stop-color="#f4f1ea"/>
      <stop offset="100%" stop-color="#e9e4d8"/>
    </radialGradient>

    <!-- Gravity well: subtle dark core that deepens the lens -->
    <radialGradient id="well" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#161412" stop-opacity="0.22"/>
      <stop offset="34%" stop-color="#161412" stop-opacity="0.10"/>
      <stop offset="62%" stop-color="#161412" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#161412" stop-opacity="0.0"/>
    </radialGradient>

    <!-- Volume on the focal ring -->
    <radialGradient id="ringVol" cx="40%" cy="34%" r="80%">
      <stop offset="0%" stop-color="#2c2722"/>
      <stop offset="55%" stop-color="#161412"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </radialGradient>

    <!-- The red aperture dot, spherical -->
    <radialGradient id="dot" cx="38%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#e9583f"/>
      <stop offset="45%" stop-color="#cc3c23"/>
      <stop offset="100%" stop-color="#9c2715"/>
    </radialGradient>

    <!-- specular highlight on the dot -->
    <radialGradient id="spec" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4ef" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fff4ef" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1000" height="1000" fill="#f4f1ea"/>
  <rect width="1000" height="1000" fill="url(#paper)"/>

  <!-- ============ WARPED FIELD (lensed space behind the aperture) ============ -->
  <g filter="url(#lens)">
    <!-- faint ruled grid -->
    <g stroke="#161412" stroke-width="1.4" opacity="0.10">
      <path d="M170 270 H830 M170 350 H830 M170 430 H830 M170 510 H830 M170 590 H830 M170 670 H830 M170 750 H830"/>
      <path d="M270 170 V830 M350 170 V830 M430 170 V830 M510 170 V830 M590 170 V830 M670 170 V830 M750 170 V830"/>
    </g>
    <!-- concentric rings being refracted by the lens -->
    <g fill="none" stroke="#161412" stroke-width="2" opacity="0.16">
      <circle cx="500" cy="500" r="120"/>
      <circle cx="500" cy="500" r="165"/>
      <circle cx="500" cy="500" r="210"/>
      <circle cx="500" cy="500" r="255"/>
      <circle cx="500" cy="500" r="300"/>
      <circle cx="500" cy="500" r="345"/>
    </g>
    <!-- a couple of cyan rings for refractive colour-fringe at the edge of the lens -->
    <g fill="none" stroke="#00d4ff" stroke-width="2.2" opacity="0.16">
      <circle cx="500" cy="500" r="232"/>
      <circle cx="500" cy="500" r="322"/>
    </g>
    <g fill="none" stroke="#b8341f" stroke-width="2.2" opacity="0.14">
      <circle cx="500" cy="500" r="188"/>
      <circle cx="500" cy="500" r="278"/>
    </g>
  </g>

  <!-- gravity-well darkening, unwarped, to seat the lens -->
  <circle cx="500" cy="500" r="360" fill="url(#well)"/>

  <!-- ============ FOCAL ELEMENT (crisp, in focus, on top) ============ -->
  <!-- anaglyph parallax echo: cyan + red displaced copies of the ring -->
  <g filter="url(#glow)">
    <circle cx="486" cy="500" r="150" fill="none" stroke="#00d4ff" stroke-width="9" opacity="0.55"/>
    <circle cx="514" cy="500" r="150" fill="none" stroke="#b8341f" stroke-width="9" opacity="0.55"/>
  </g>

  <!-- the sharp ink ring (the aperture) -->
  <g filter="url(#soft)">
    <circle cx="500" cy="500" r="150" fill="none" stroke="url(#ringVol)" stroke-width="26"/>
    <!-- inner + outer hairlines for crisp edges -->
    <circle cx="500" cy="500" r="163" fill="none" stroke="#0c0a09" stroke-width="1.5" opacity="0.5"/>
    <circle cx="500" cy="500" r="137" fill="none" stroke="#0c0a09" stroke-width="1.5" opacity="0.5"/>
    <!-- subtle top highlight on the ring -->
    <path d="M390 430 A150 150 0 0 1 610 430" fill="none" stroke="#5a514a" stroke-width="6" opacity="0.45" stroke-linecap="round"/>
  </g>

  <!-- offset filled red dot inside the ring (the parallax displacement) -->
  <g>
    <ellipse cx="566" cy="448" rx="42" ry="40" fill="#161412" opacity="0.22" filter="url(#glow)"/>
    <circle cx="560" cy="442" r="40" fill="url(#dot)"/>
    <circle cx="560" cy="442" r="40" fill="none" stroke="#7e1f10" stroke-width="1.5" opacity="0.6"/>
    <circle cx="548" cy="430" r="14" fill="url(#spec)"/>
  </g>
</svg>