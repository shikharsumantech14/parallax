<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <defs>
    <radialGradient id="paper" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#f7f4ee"/>
      <stop offset="100%" stop-color="#efebe1"/>
    </radialGradient>
    <radialGradient id="dotVol" cx="38%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#3a3633"/>
      <stop offset="55%" stop-color="#1d1a18"/>
      <stop offset="100%" stop-color="#0c0b0a"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="dropsh" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#161412" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="url(#paper)"/>

  <g transform="translate(500 500)">

    <g opacity="0.92" filter="url(#soft)">
      <g transform="translate(-26 -22)">
        <circle cx="0" cy="0" r="232" fill="none" stroke="#00d4ff" stroke-width="46"/>
        <circle cx="118" cy="-92" r="74" fill="#00d4ff"/>
      </g>
      <g transform="translate(26 22)">
        <circle cx="0" cy="0" r="232" fill="none" stroke="#b8341f" stroke-width="46"/>
        <circle cx="118" cy="-92" r="74" fill="#b8341f"/>
      </g>
    </g>

    <g opacity="0.95">
      <g transform="translate(-26 -22)">
        <circle cx="0" cy="0" r="232" fill="none" stroke="#00d4ff" stroke-width="40" opacity="0.85"/>
        <circle cx="118" cy="-92" r="70" fill="#00d4ff" opacity="0.85"/>
      </g>
      <g transform="translate(26 22)">
        <circle cx="0" cy="0" r="232" fill="none" stroke="#b8341f" stroke-width="40" opacity="0.85"/>
        <circle cx="118" cy="-92" r="70" fill="#b8341f" opacity="0.85"/>
      </g>
    </g>

    <g filter="url(#dropsh)">
      <circle cx="0" cy="0" r="232" fill="none" stroke="#161412" stroke-width="40"/>
      <circle cx="118" cy="-92" r="70" fill="url(#dotVol)"/>
      <ellipse cx="98" cy="-116" rx="26" ry="16" fill="#f4f1ea" opacity="0.16"/>
    </g>

  </g>
</svg>